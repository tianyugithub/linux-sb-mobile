plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.linuxnotify'
version = '1.0.0'

android {
  namespace "expo.modules.linuxnotify"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  compileOnly 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
}
